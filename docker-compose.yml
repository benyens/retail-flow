services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retail_flow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retail_flow"]
      interval: 5s
      timeout: 5s
      retries: 12
  frontend:
    build: .
    ports:
      - "5173:5173"
    environment:
      VITE_USE_MOCK: "true"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
